# Optional: run the real backing services locally with Docker.
#   docker compose up -d
# then in server/.env set:
#   REDIS_URL=redis://localhost:6379
#   ELASTICSEARCH_NODE=http://localhost:9200
# (MongoDB here listens on 27017, same as the embedded dev database - run one or the other.)
services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  mongo-data:
  es-data:
