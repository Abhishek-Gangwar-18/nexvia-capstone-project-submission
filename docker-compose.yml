name: flowboard

# Local development only needs the data services:   docker compose up -d db redis
# Full stack (API, worker, beat, SPA behind nginx):   docker compose up -d --build   -> http://localhost:8080

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me-please-use-a-long-random-string-in-prod}
  DJANGO_DEBUG: ${APP_DJANGO_DEBUG:-False}
  # Local stack: Swagger/OpenAPI stay open (the image runs with DEBUG off). Production defaults to off.
  API_DOCS: ${API_DOCS:-public}
  DJANGO_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-localhost,127.0.0.1}
  CSRF_TRUSTED_ORIGINS: ${APP_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  DJANGO_BEHIND_PROXY: "True"
  DATABASE_URL: postgres://${POSTGRES_USER:-flowboard}:${POSTGRES_PASSWORD:-flowboard}@db:5432/${POSTGRES_DB:-flowboard}
  REDIS_URL: redis://redis:6379/0
  FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8080}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-localhost}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-FlowBoard <no-reply@flowboard.test>}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

x-backend: &backend
  build: ./backend
  image: ${BACKEND_IMAGE:-flowboard-backend:local}
  restart: unless-stopped
  environment: *backend-env
  volumes:
    - media:/app/media

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowboard}
      POSTGRES_USER: ${POSTGRES_USER:-flowboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowboard}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    command: ["web"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
      # Loads the Faker demo tenants (Acme, Globex, Initech) on first start; skipped when they exist.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["beat"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-flowboard-frontend:local}
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend:8000
      # Local development: the admin stays reachable from your machine ("*" = everyone). Production defaults
      # to closed; see docker-compose.prod.yml.
      ADMIN_ALLOWLIST: ${ADMIN_ALLOWLIST:-*}
      CSP_HEADER: ${CSP_HEADER:-Content-Security-Policy}
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  media:
