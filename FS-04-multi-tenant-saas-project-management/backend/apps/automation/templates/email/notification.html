{% extends "email/base.html" %}
{% block content %}
<h1 style="margin:0 0 8px;font-size:18px">{{ title }}</h1>
<p style="margin:0 0 20px;font-size:14px;line-height:1.5;color:#334155">{{ body }}</p>
{% if url %}<a href="{{ url }}" style="display:inline-block;padding:10px 16px;background:#4f46e5;color:#ffffff;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none">Open in FlowBoard</a>{% endif %}
{% endblock %}
{% block footer %}You're getting this because of your {{ workspace }} workspace. Turn these emails off under Profile &amp; security.{% endblock %}
