<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f1f5f9;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px">
      <tr>
        <td style="padding:28px">
          <p style="margin:0 0 20px;font-size:16px;font-weight:700;color:#4f46e5">FlowBoard</p>
          {% block content %}{% endblock %}
        </td>
      </tr>
    </table>
    <p style="max-width:520px;margin:16px auto 0;font-size:12px;color:#64748b;text-align:center">{% block footer %}{% endblock %}</p>
  </body>
</html>
