name: CI/CD

# Runs on every push and pull request.
#   backend   -> migrations check + pytest against real Postgres/Redis
#   frontend  -> pnpm install + typecheck/build
#   docker    -> build both images, boot the full stack, run scripts/smoke_test.py;
#                on pushes to main, push the images to GHCR (ghcr.io/<owner>/flowboard-*)
#   deploy    -> on main only, and only when the DEPLOY_* secrets exist: pull + restart on the server over SSH

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowboard
          POSTGRES_USER: flowboard
          POSTGRES_PASSWORD: flowboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowboard -d flowboard"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://flowboard:flowboard@localhost:5432/flowboard
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-not-a-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python -m pytest -q --create-db -p no:cacheprovider

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Typecheck and build
        run: pnpm build

  docker:
    name: Docker build + end-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose build
      - name: Start full stack (seeds demo data)
        run: docker compose up -d --wait --wait-timeout 300
      - name: Smoke test through nginx
        run: python3 scripts/smoke_test.py http://localhost:8080
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for app in backend frontend; do
            for tag in latest "${GITHUB_SHA::12}"; do
              docker tag "flowboard-${app}:local" "${prefix}/flowboard-${app}:${tag}"
              docker push "${prefix}/flowboard-${app}:${tag}"
            done
          done

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/flowboard' }}
    steps:
      - name: Check deploy configuration
        id: cfg
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: add DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY secrets to enable it."
          fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.enabled == 'true'
      - name: Configure SSH
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Pull and restart on server
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          SSH="ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST}"
          $SSH "mkdir -p ${DEPLOY_PATH}"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.prod.yml"
          $SSH "cd ${DEPLOY_PATH} && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --remove-orphans && docker image prune -f"
