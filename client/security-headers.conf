# Security headers for the web app. Included in the server block AND in every location that has its own
# add_header (nginx drops inherited add_header lines in a location that sets any of its own).
# The CSP only limits framing, plugins and <base>: scripts, styles and images come from several hosts
# (Stripe, Google Fonts, S3, product image CDNs), so they are not restricted here.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
