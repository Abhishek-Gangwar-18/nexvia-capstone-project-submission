name: flowboard

# Production stack used by the GitHub Actions deploy job. It runs the images that CI pushed to GHCR
# (no source code is needed on the server). Put a .env next to this file with at least:
#   IMAGE_PREFIX=ghcr.io/<owner-lowercase>     IMAGE_TAG=latest
#   DJANGO_SECRET_KEY=<long random string>     POSTGRES_PASSWORD=<strong password>
#   APP_DOMAIN=flowboard.example.com           (plus STRIPE_* / EMAIL_* as needed)
# GHCR packages are private by default: on the server run once
#   echo <token with read:packages> | docker login ghcr.io -u <github-user> --password-stdin
# Then:  docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# TLS: put a TLS-terminating proxy or load balancer in front of APP_HTTP_PORT and set DJANGO_SECURE_COOKIES=True.

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: "False"
  # Swagger/OpenAPI: off (404) by default; "staff" serves them to authenticated staff only.
  API_DOCS: ${API_DOCS:-off}
  DJANGO_ALLOWED_HOSTS: ${APP_DOMAIN:?set APP_DOMAIN in .env},localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: ${APP_SCHEME:-https}://${APP_DOMAIN}
  # Same-origin SPA + API: no cross-origin callers by default.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  DJANGO_BEHIND_PROXY: "True"
  DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-True}
  # HTTPS is enforced here (TLS proxy in front, DJANGO_BEHIND_PROXY trusts its X-Forwarded-Proto): redirect
  # plain HTTP and send HSTS for a year. Serving plain HTTP only (APP_SCHEME=http)? Set both to False/0.
  # includeSubDomains / preload stay off unless DJANGO_HSTS_INCLUDE_SUBDOMAINS / DJANGO_HSTS_PRELOAD are set.
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
  DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
  DATABASE_URL: postgres://${POSTGRES_USER:-flowboard}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-flowboard}
  REDIS_URL: redis://redis:6379/0
  FRONTEND_URL: ${APP_SCHEME:-https}://${APP_DOMAIN}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-localhost}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-FlowBoard <no-reply@flowboard.test>}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

x-backend: &backend
  image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}/flowboard-backend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  environment: *backend-env
  volumes:
    - media:/app/media

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowboard}
      POSTGRES_USER: ${POSTGRES_USER:-flowboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    command: ["web"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["beat"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ${IMAGE_PREFIX}/flowboard-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend:8000
      # Django admin: closed (404) unless you list the IPs/CIDRs allowed in, e.g. ADMIN_ALLOWLIST=203.0.113.7,10.8.0.0/24
      ADMIN_ALLOWLIST: ${ADMIN_ALLOWLIST:-}
      # The TLS proxy / load balancer in front of nginx. Only its X-Forwarded-For is trusted for the client IP
      # (admin allowlist, login rate limit); leave empty if clients connect to nginx directly.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # Content-Security-Policy (enforced) or Content-Security-Policy-Report-Only while checking a change.
      CSP_HEADER: ${CSP_HEADER:-Content-Security-Policy}
    ports:
      - "${APP_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
