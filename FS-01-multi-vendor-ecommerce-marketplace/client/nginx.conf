# Serves the built app and forwards API calls to the api container (same as the Vite dev proxy).
# Some API prefixes are also page URLs (/cart, /orders, /vendor/*...): a browser page load
# (Accept: text/html) gets the app, everything else goes to the API.
map $http_accept $vendora_page {
  default 0;
  ~text/html 1;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 20m;
  # Don't print the nginx version in the Server header or error pages.
  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location ~ ^/(auth|home|categories|products|stores|coupons|uploads|cart|orders|returns|vendor|admin|payments|health)(/|$) {
    if ($vendora_page) { rewrite ^ /index.html last; }
    proxy_pass http://api:5050;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-sent events (live order updates) must not be buffered
    proxy_buffering off;
    proxy_read_timeout 1h;
    # The same URL answers HTML (page load) or JSON (API call) depending on Accept, so caches must keep them apart.
    add_header Vary Accept always;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The app shell: never reused from cache, so an API call to a page URL can't receive it
  # and a new deploy is picked up on the next load (asset file names change with each build).
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Vary Accept always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    try_files $uri /index.html;
  }
}
